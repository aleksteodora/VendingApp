<div class="shell">
  <header class="shell-header">
    <div class="shell-brand">
      <span class="eyebrow">Vending Management</span>
      <h1>Admin Panel</h1>
    </div>
    <div class="shell-user">
      <span class="user-name">{{ admin?.fullName }}</span>
      <span class="user-role">{{ admin?.role }}</span>
      <button class="btn-logout" (click)="logout()">Log Out</button>
    </div>
  </header>

  <nav class="shell-tabs">
    <a routerLink="/admin/users" routerLinkActive="active-tab" class="tab">Users</a>
    <a routerLink="/admin/processing-fee" routerLinkActive="active-tab" class="tab">Transactions</a>
    <a *ngIf="isSuperAdmin" routerLink="/admin/admins" routerLinkActive="active-tab" class="tab">Admins</a>
  </nav>

  <main class="shell-content">
    <router-outlet></router-outlet>
  </main>
</div>
