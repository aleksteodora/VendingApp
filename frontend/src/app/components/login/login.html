<div class="login-page">
  <div class="login-card">
    <header class="login-header">
      <span class="eyebrow">Vending Management</span>
      <h1>Admin Login</h1>
    </header>

    <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="admin@vending.com" />
      </div>

      <div class="field">
  <label for="password">Password</label>
  <div class="password-wrapper">
    <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password" placeholder="••••••••" />
    <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
      {{ showPassword ? 'Hide' : 'Show' }}
    </button>
  </div>
</div>

      <button type="submit" class="btn-primary">Log In</button>
    </form>
  </div>
</div>
