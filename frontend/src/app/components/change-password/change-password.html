<div class="page">
  <header class="page-header">
    <h1>Change Password</h1>
  </header>

  <div class="layout-single">
    <section class="panel form-panel">
      <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="currentPassword">Current Password</label>
          <div class="password-wrapper">
            <input [type]="showCurrentPassword ? 'text' : 'password'" id="currentPassword" formControlName="currentPassword" placeholder="••••••••" />
            <button type="button" class="toggle-password" (click)="toggleCurrentPassword()">
              {{ showCurrentPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
          <span class="field-error" *ngIf="currentPassword?.invalid && currentPassword?.touched">
            <span *ngIf="currentPassword?.errors?.['required']">Current password is required.</span>
          </span>
        </div>

        <div class="field">
          <label for="newPassword">New Password</label>
          <div class="password-wrapper">
            <input [type]="showNewPassword ? 'text' : 'password'" id="newPassword" formControlName="newPassword" placeholder="••••••••" />
            <button type="button" class="toggle-password" (click)="toggleNewPassword()">
              {{ showNewPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
          <span class="field-error" *ngIf="newPassword?.invalid && newPassword?.touched">
            <span *ngIf="newPassword?.errors?.['required']">New password is required.</span>
            <span *ngIf="newPassword?.errors?.['minlength']">New password must be at least 6 characters.</span>
          </span>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="password-wrapper">
            <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" formControlName="confirmPassword" placeholder="••••••••" />
            <button type="button" class="toggle-password" (click)="toggleConfirmPassword()">
              {{ showConfirmPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
          <span class="field-error" *ngIf="confirmPassword?.invalid && confirmPassword?.touched">
            <span *ngIf="confirmPassword?.errors?.['required']">Please confirm your new password.</span>
          </span>
          <span class="field-error" *ngIf="form.errors?.['passwordsMismatch'] && confirmPassword?.touched">
            Passwords do not match.
          </span>
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">Change Password</button>
          <button type="button" class="btn-ghost" (click)="goBack()">Cancel</button>
        </div>
      </form>
    </section>
  </div>
</div>
